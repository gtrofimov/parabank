services:
  parabank:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    ports:
      - "${PARABANK_SERVLET_PORT:-8081}:8080"
      - "${JTEST_AGENT_REST_PORT:-8050}:8050"
    volumes:
      - parabank_monitor_runtime:/usr/local/tomcat/monitor/runtime_coverage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/parabank/index.htm"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  parabank_monitor_runtime:

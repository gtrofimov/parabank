name: Jira Feature Intake
on:
  workflow_dispatch:
    inputs:
      jira_ticket:
        description: 'Jira ticket number (e.g., PGT-23)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  jira-feature-intake:
    name: Jira Feature Delivery (Story -> Code + Tests + PR)
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Jira feature delivery
        env:
          COPILOT_GITHUB_TOKEN: "${{ secrets.COPILOT_PAT }}"
          GH_TOKEN: "${{ secrets.COPILOT_PAT }}"
          GITHUB_TOKEN: "${{ secrets.COPILOT_PAT }}"
          ROVO_EMAIL: "${{ secrets.ROVO_EMAIL }}"
          ROVO_TOKEN: "${{ secrets.ROVO_TOKEN }}"
          SOATEST_MCP_AUTH_TOKEN: "${{ secrets.SOATEST_MCP_AUTH_TOKEN }}"
          DTP_URL: "${{ secrets.DTP_URL }}"
          DTP_USER: "${{ secrets.DTP_USER }}"
          DTP_PASSWORD: "${{ secrets.DTP_PASSWORD }}"
          JIRA_TICKET: "${{ inputs.jira_ticket }}"
        run: bash .github/workflows/jira-feature-intake.sh

      - name: Destroy ParaBank Docker deployment
        if: always()
        run: docker compose --project-name parabank -f compose.parabank.yml down --volumes --remove-orphans

      - name: Upload intake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-feature-intake-evidence
          path: |
            .agents/instances/
            jira_feature_intake.txt
